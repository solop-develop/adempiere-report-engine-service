# This workflow will build a Java project with Gradle
# This file was contributed by ysenih@erpya.com from ERP Consultores y Asociados, C.A
# This file was contributed by EdwinBetanc0urt@outlook.com https://github.com/EdwinBetanc0urt
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle
#
# Combines what used to be two separate workflows (ci.yml + branch-publish.yml):
# every push builds once; the Docker images are only pushed to the registries
# on pushes to main/master or when the workflow is triggered manually.

name: Continuous Integration with Gradle

permissions:
  contents: write # to upload release assets
  packages: write # to publish packages
  # dorny/paths-filter needs this: actions/checkout below uses the default
  # fetch-depth: 1, so it can't diff against the PR base locally and falls
  # back to the GitHub API's listFiles endpoint, which needs pull-requests: read.
  # Without it, the "Check for Docker context changes" step fails with
  # "Resource not accessible by integration".
  pull-requests: read

on:
  push:
    branches:
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
    paths-ignore:
      - README.md
      - README.es.md
  pull_request:
    branches:
      - main
      - master
      - develop
      - experimental
      - test/**
      - chore/**
      - bugfix/**
      - feature/**
      - hotfix/**
    paths-ignore:
      - README.md
      - README.es.md
  # Allows building/publishing an image for any branch by triggering manually from the Actions tab
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-ci:
    name: Build ADempiere Report Engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Setup Gradle 9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.1.0 # current

      - name: Set Version Properties
        run: |
          echo "MAIN_VERSION=${{ github.ref_name }}-${{ github.sha }}" >> src/main/java/org/spin/base/version.properties
          echo "DATE_VERSION=$(date +'%Y-%m-%d')" >> src/main/java/org/spin/base/version.properties
          echo "IMPLEMENTATION_VERSION=${{ github.sha }}" >> src/main/java/org/spin/base/version.properties

      - name: Run Create Release
        run: gradle createRelease --warning-mode all --stacktrace
        env:
          ORG_GRADLE_PROJECT_deployUsername: ${{ secrets.DEPLOY_USER }}
          ORG_GRADLE_PROJECT_deployToken: ${{ secrets.DEPLOY_TOKEN }}
          ORG_GRADLE_PROJECT_deployRepository: ${{ secrets.DEPLOY_REPOSITORY }}
          GITHUB_DEPLOY_USER: ${{ github.actor }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEPLOY_REPOSITORY: ${{ secrets.DEPLOY_REPOSITORY }}

      - name: Prepare flat artifacts
        run: |
          mkdir -p flat_artifacts/
          cp build/descriptors/adempiere-report-engine-service.dsc flat_artifacts/ || echo "Warning: .dsc file not found"
          cp build/release/adempiere-report-engine-service.* flat_artifacts/ || echo "Warning: release files not found"
          cp docker-compose/envoy/envoy.yaml flat_artifacts/ || echo "Warning: envoy.yaml not found"
          cp resources/env.yaml flat_artifacts/ || echo "Warning: env.yaml not found"
          ls -la flat_artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-artifacts
          path: flat_artifacts/*
          retention-days: 1

      # Gated on actual Dockerfile/build-context changes: validates the images
      # still build on every push, without pushing anything, so breakage in
      # docker/*.Dockerfile is caught here instead of only surfacing in the
      # push-*-image-ci jobs below when they push for real.
      - name: Check for Docker context changes
        id: docker-changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'docker/**'

      - name: Prepare Docker build context
        if: steps.docker-changes.outputs.docker == 'true'
        run: |
          unzip flat_artifacts/adempiere-report-engine-service.zip -d docker/
          cp flat_artifacts/adempiere-report-engine-service.dsc docker/

      - name: Setup Docker Buildx
        if: steps.docker-changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Validate Alpine image (build, no push)
        if: steps.docker-changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine.Dockerfile
          push: false
          cache-from: type=gha,scope=ci-alpine-branch
          cache-to: type=gha,mode=min,scope=ci-alpine-branch

      - name: Validate Ubuntu image (build, no push)
        if: steps.docker-changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ubuntu.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-ubuntu-branch
          cache-to: type=gha,mode=min,scope=ci-ubuntu-branch

      - name: Validate Proxy image (build, no push)
        if: steps.docker-changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/proxy.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-proxy-branch
          cache-to: type=gha,mode=min,scope=ci-proxy-branch

  # Check secrets to push image in docker hub registry
  check-docker-secrets:
    name: Check if the registry information was set on secrets and variables
    needs:
      - build-ci
    runs-on: ubuntu-latest
    outputs:
      is_have_secrets: ${{ steps.check_docker_hub_secrets_job.outputs.is_have_secrets }}
    steps:
      - id: check_docker_hub_secrets_job
        run: |
          if [[ "${{ vars.DOCKER_REGISTRY }}" != "" && \
                "${{ vars.DOCKER_REPO }}" != "" && \
                "${{ secrets.DOCKER_USERNAME }}" != "" && \
                "${{ secrets.DOCKER_TOKEN }}" != "" ]]; \
          then
            echo "Secrets to use a container registry are configured in the repo"
            echo "is_have_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "Secrets to use a container registry were not configured in the repo"
            echo "is_have_secrets=false" >> $GITHUB_OUTPUT
          fi

  # Publish docker alpine image in Docker Hub Registry to application
  push-alpine-image-ci:
    name: Push docker alpine image to Container Registry (CI)
    needs:
      - check-docker-secrets
    # Only run if the secrets exist and it's a push to main, or a manual trigger (workflow_dispatch)
    if: >-
      needs.check-docker-secrets.outputs.is_have_secrets == 'true' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'master' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts/

      - name: Unzip Asset
        run: |
          tree artifacts
          unzip artifacts/adempiere-report-engine-service.zip -d docker/

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          # CONFIGURE DOCKER SECRETS INTO REPOSITORY
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set Docker Alpine Tags
        id: set_tags_alpine
        run: |
          # Get branch name and clean it for Docker tags
          BRANCH_NAME="${{ github.ref_name }}"
          # clean branch name (clear invalid characters to Docker tags)
          CLEAN_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # Set the tag with branch name
          TAGS="${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_REPO }}:$CLEAN_BRANCH_NAME-alpine"

          # Set the output variable for the next step to use
          echo "tags_to_push=$TAGS" >> $GITHUB_OUTPUT

      - name: Push alpine image in Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine.Dockerfile
          push: true
          tags: ${{ steps.set_tags_alpine.outputs.tags_to_push }}

  # Publish docker image multiplatform in Docker Hub Registry to application
  push-ubuntu-image-ci:
    name: Push docker ubuntu multiplatform image to Container Registry (CI)
    needs:
      - check-docker-secrets
    # Only run if the secrets exist and it's a push to main, or a manual trigger (workflow_dispatch)
    if: >-
      needs.check-docker-secrets.outputs.is_have_secrets == 'true' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'master' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts/

      - name: Unzip Asset
        run: |
          tree artifacts
          unzip artifacts/adempiere-report-engine-service.zip -d docker/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          # CONFIGURE DOCKER SECRETS INTO REPOSITORY
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set Docker Tags
        id: set_tags
        run: |
          # Get branch name and clean it for Docker tags
          BRANCH_NAME="${{ github.ref_name }}"
          # clean branch name (clear invalid characters to Docker tags)
          CLEAN_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # Set the tag with branch name
          TAGS="${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_REPO }}:$CLEAN_BRANCH_NAME"

          # Set the output variable for the next step to use
          echo "tags_to_push=$TAGS" >> $GITHUB_OUTPUT

      - name: Push image in Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ubuntu.Dockerfile
          platforms: linux/amd64,linux/amd64/v2
          # platforms: linux/amd64,linux/amd64/v2,linux/arm64/v8
          push: true
          tags: ${{ steps.set_tags.outputs.tags_to_push }}

  # Check secrets to push image in docker hub registry
  check-proxy-docker-secrets:
    name: Check if Container Registry registry information was set on secrets
    needs:
      - build-ci
    runs-on: ubuntu-latest
    outputs:
      is_have_secrets: ${{ steps.check_secret_job.outputs.is_have_secrets }}
    steps:
      - id: check_secret_job
        run: |
          if [[ "${{ vars.DOCKER_REGISTRY }}" != "" && \
                "${{ vars.DOCKER_REPO_PROXY }}" != "" && \
                "${{ secrets.DOCKER_USERNAME }}" != "" && \
                "${{ secrets.DOCKER_TOKEN }}" != "" ]]; \
          then
            echo "Secrets to use a container registry are configured in the repo"
            echo "is_have_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "Secrets to use a container registry were not configured in the repo"
            echo "is_have_secrets=false" >> $GITHUB_OUTPUT
          fi

  # Publish docker image multiplatform in Docker Hub Registry to application
  push-grpc-proxy-image-ci:
    name: Push grpc-proxy docker image to Container Registry
    needs:
      - check-proxy-docker-secrets
    # Only run if the secrets exist and it's a push to main, or a manual trigger (workflow_dispatch)
    if: >-
      needs.check-proxy-docker-secrets.outputs.is_have_secrets == 'true' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'master' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts/

      - name: Move descriptor
        run: |
          tree artifacts
          cp artifacts/adempiere-report-engine-service.dsc docker/ || echo "Warning: descriptor file not found"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          # CONFIGURE DOCKER SECRETS INTO REPOSITORY
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set Docker Tags
        id: set_envoy_tags
        run: |
          # Get branch name and clean it for Docker tags
          BRANCH_NAME="${{ github.ref_name }}"
          # clean branch name (clear invalid characters to Docker tags)
          CLEAN_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # Set the tag with branch name
          TAGS="${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_REPO_PROXY }}:$CLEAN_BRANCH_NAME"

          # Set the output variable for the next step to use
          echo "tags_to_push=$TAGS" >> $GITHUB_OUTPUT

      - name: Push image in Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/proxy.Dockerfile
          platforms: linux/amd64,linux/amd64/v2,linux/arm64/v8
          push: true
          tags: ${{ steps.set_envoy_tags.outputs.tags_to_push }}
